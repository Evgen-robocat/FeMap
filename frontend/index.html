<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlatEarthMap</title>

  <!-- 1. Стили — первыми чтобы не было мигания -->
  <link rel="stylesheet" href="/static/style.css?v=728">

  <!-- 2. D3.js v7 — до всех map-скриптов, они зависят от d3.* -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <!-- 3. Astronomy-engine — до astro.js, astroOk() проверяет его наличие -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.js"></script>

  <!-- 4. satellite.js 4.1.3 — SGP4-пропагатор для МКС (v5.8.0)
       Должен быть загружен до astro.js (satelliteOk() и loadIssTle()) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>

  <!-- 5. Модули карты — строго в этом порядке:
       config → state → astro → render → main
       Каждый следующий видит глобальные переменные предыдущего -->
  <script src="/static/config.js?v=728"></script>
  <script src="/static/projection.js?v=721"></script>
  <script src="/static/state.js?v=724"></script>
  <script src="/static/astro.js?v=723"></script>
  <script src="/static/satellite.js?v=721"></script>
  <script src="/static/eclipse.js?v=717"></script>
  <script src="/static/transit.js?v=721"></script>
  <script src="/static/events.js?v=721"></script>
  <script src="/static/phases.js?v=717"></script>
  <script src="/static/render.js?v=727"></script>
  <script src="/static/main.js?v=725"></script>

</head>
<body>
  <div id="controls">
    <h2 class="panel-title">
      <span>AE Map <span class="version-badge">…</span></span>
      <select id="lang-select" class="lang-select" aria-label="Language / Язык / Sprache">
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </h2>

    <div class="control-group">
      <label for="inp-lat" data-i18n="latLabel">Широта центра</label>
      <div class="input-row">
        <input type="text" inputmode="decimal" id="inp-lat"
               value="90" placeholder="−90…90" autocomplete="off">
        <button class="btn-sign" data-target="inp-lat" title="±">±</button>
      </div>
    </div>

    <div class="control-group">
      <label for="inp-lon" data-i18n="lonLabel">Долгота центра</label>
      <div class="input-row">
        <input type="text" inputmode="decimal" id="inp-lon"
               value="0" placeholder="−180…180" autocomplete="off">
        <button class="btn-sign" data-target="inp-lon" title="±">±</button>
      </div>
    </div>

    <button id="btn-apply" class="btn-primary" data-i18n="applyBtn">▶ Применить центр</button>

    <div class="control-group">
      <label for="sel-proj" data-i18n="projLabel">Проекция</label>
      <select id="sel-proj" class="lang-select" style="width:100%">
        <option value="ae" data-i18n="projAE">Азимутальная равнопромежуточная</option>
        <option value="shilova-r" data-i18n="projShR">Карта с изогнутыми меридианами ↻</option>
        <option value="shilova-l" data-i18n="projShL">Карта с изогнутыми меридианами ↺</option>
      </select>
    </div>

    <div class="presets">
      <button class="btn-preset" data-lat="90"  data-lon="0"  data-i18n="presetN">Сев. полюс</button>
      <button class="btn-preset" data-lat="-90" data-lon="0"  data-i18n="presetS">Юж. полюс</button>
      <button class="btn-preset" data-lat="0"   data-lon="0"  data-i18n="presetEq">Экватор / 0,0</button>
      <button id="btn-reset-zoom" class="btn-preset"
              style="background:#2a4a6a;" data-i18n="resetZoom">⊙ Сброс зума</button>
    </div>

    <!-- Чекбоксы карты -->
    <div class="control-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-grid" checked>
        <span class="checkbox-custom"></span>
        <span data-i18n="gridChk">Сетка 30°</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-labels">
        <span class="checkbox-custom"></span>
        <span data-i18n="labelsChk">Подписи координат</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-cities">
        <span class="checkbox-custom"></span>
        <span data-i18n="citiesChk">🏙 Города и метки</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-ruler">
        <span class="checkbox-custom"></span>
        <span data-i18n="rulerChk">📏 Линейка расстояний</span>
      </label>
      <label class="checkbox-label" style="margin-left:18px;">
        <input type="checkbox" id="chk-ruler-trail" checked>
        <span class="checkbox-custom"></span>
        <span data-i18n="rulerTrailChk">🧲 магнит линейки: хвост × меридиан</span>
      </label>
      <!-- Маршруты рейсов — дуги великого круга -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-routes">
        <span class="checkbox-custom"></span>
        <span data-i18n="routesChk">✈ Маршруты рейсов</span>
      </label>
      <!-- Линии (v6.0.0): экватор, тропики, эклиптика -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-equator">
        <span class="checkbox-custom"></span>
        <span data-i18n="equatorChk">Экватор</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-tropics">
        <span class="checkbox-custom"></span>
        <span data-i18n="tropicsChk">Тропики</span>
      </label>
      <!-- v6.9.0: вид из космоса -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-sat">
        <span class="checkbox-custom"></span>
        <span data-i18n="satChk">🛰 Вид из космоса (NASA)</span>
      </label>
      <div id="sat-opts" style="display:none; margin:0 0 8px 26px;">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-sat-night" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="satNightChk">🌃 ночь и огни городов</span>
        </label>
        <div style="font-size:9px; color:#6a8a9a;" data-i18n="satCredit">Текстуры: Solar System Scope, CC BY 4.0 (данные NASA)</div>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-ecliptic">
        <span class="checkbox-custom"></span>
        <span data-i18n="eclipticChk">Эклиптика</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-timezones">
        <span class="checkbox-custom"></span>
        <span data-i18n="tzChk">Часовые пояса</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-tz-labels">
        <span class="checkbox-custom"></span>
        <span data-i18n="tzLabelsChk">Подписи поясов</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-tz-dial">
        <span class="checkbox-custom"></span>
        <span data-i18n="tzDialChk">Циферблат по кругу (от Гринвича)</span>
      </label>
    </div>

    <!-- Чекбоксы астрономии -->
    <div class="control-group checkbox-group"
         style="border-top:1px solid #1e3a5a; padding-top:6px; margin-top:4px;">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-sun" checked>
        <span class="checkbox-custom"></span>
        <span data-i18n="sunChk">☀ Солнце</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-night" checked>
        <span class="checkbox-custom"></span>
        <span data-i18n="nightChk">🌓 День / Ночь</span>
      </label>
      <label class="checkbox-label" style="margin-left:22px;">
        <input type="checkbox" id="chk-twilight">
        <span class="checkbox-custom"></span>
        <span data-i18n="twiChk">сумерки (гражд. / навиг. / астр.)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-moon" checked>
        <span class="checkbox-custom"></span>
        <span data-i18n="moonChk">🌙 Луна</span>
      </label>
      <!-- v6.6.0: тень Земли (умбра/пенумбра) и узлы Луны (Раху/Кету) -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-shadow">
        <span class="checkbox-custom"></span>
        <span data-i18n="shadowChk">🌑 Чёрное солнце (Умбра / Пенумбра)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-nodes">
        <span class="checkbox-custom"></span>
        <span data-i18n="nodesChk">☊☋ Узлы Луны (Раху / Кету)</span>
      </label>
      <!-- v6.8.0: наблюдатель -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-observer">
        <span class="checkbox-custom"></span>
        <span data-i18n="obsChk">👁 Наблюдатель (точка, высота / азимут)</span>
      </label>
      <div id="observer-opts" style="display:none; margin:2px 0 8px 26px;">
        <div style="display:flex; gap:4px; margin-bottom:4px;">
          <input type="text" inputmode="decimal" id="obs-lat" style="width:50%;min-width:0;padding:6px;">
          <input type="text" inputmode="decimal" id="obs-lon" style="width:50%;min-width:0;padding:6px;">
        </div>
        <div style="display:flex; gap:4px;">
          <button id="btn-obs-pick" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="obsPick">📍 Выбрать на карте</button>
          <button id="btn-obs-here" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="obsHere">Центр карты</button>
        </div>
      </div>
      <!-- v7.1.5: круги видимости — отдельно от наблюдателя -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-rings">
        <span class="checkbox-custom"></span>
        <span data-i18n="ringsChk">⭕ Круги видимости (тело над горизонтом)</span>
      </label>
      <div id="rings-opts" style="display:none; margin:0 0 8px 26px;">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-ring-sun" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="ringSunFill">заливка светом Солнца</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-ring-moon" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="ringMoonFill">заливка светом Луны (по фазе)</span>
        </label>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-phase">
        <span class="checkbox-custom"></span>
        <span data-i18n="phaseChk">🌗 Фазы (Луна, Меркурий, Венера, Марс)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-realvis">
        <span class="checkbox-custom"></span>
        <span data-i18n="realVisChk">👁 Реальная видимость (серым — не видна)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-planets">
        <span class="checkbox-custom"></span>
        <span data-i18n="planetsChk">🪐 Планеты</span>
      </label>
      <div id="planets-opts" style="display:none; padding-left:22px;"></div>
      <!-- МКС (v5.8.0) — после Планет, перед Звёздами -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-iss">
        <span class="checkbox-custom"></span>
        <span data-i18n="issChk">🛰 МКС</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-stars">
        <span class="checkbox-custom"></span>
        <span data-i18n="starsChk">✦ Звёзды</span>
      </label>
      <!-- Млечный Путь (v5.9.0) — после Звёзд -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-milkyway">
        <span class="checkbox-custom"></span>
        <span data-i18n="milkywayChk">🌌 Млечный Путь</span>
      </label>
      <!-- Зодиак (v6.0.0) — границы 13 созвездий; подчинённые переключатели
           видны только при включённом зодиаке -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-zodiac">
        <span class="checkbox-custom"></span>
        <span data-i18n="zodiacChk">♈ Созвездия зодиака</span>
      </label>
      <div id="zodiac-opts" style="display:none; padding-left:22px;">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-zodiac-hl" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="zodiacHlChk">подсветка Солнца / Луны / планет</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-zodiac-stars" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="zodiacStarsChk">звёзды и фигуры созвездий</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-ophiuchus">
          <span class="checkbox-custom"></span>
          <span data-i18n="ophiuchusChk">Змееносец (13-е)</span>
        </label>
      </div>
      <!-- Координаты тел (v6.4.0): чекбоксы создаёт buildCoordsOpts() в main.js -->
      <details id="coords-details" style="margin-top:6px;">
        <summary data-i18n="coordsTitle" style="cursor:pointer; font-size:0.85rem; color:#a0d8ef;">📍 Координаты тел</summary>
        <div id="coords-opts" style="padding-left:6px; margin-top:4px;"></div>
      </details>
    </div>

    <!-- Панель времени — скрыта если ни один астро-чекбокс не включён -->
    <div id="astro-time" style="display:none; padding:4px 0;">
      <div id="astro-display"
           style="font-family:monospace; font-size:11px; color:#a0c4d8;
                  text-align:center; margin-bottom:5px;">…</div>

      <!-- Календарь (v6.4.0): точная дата и время UTC + прыжок к затмению -->
      <div style="font-size:9px; color:#6a8a9a; text-align:center; margin-bottom:2px;"
           data-i18n="dateLabel">Дата и время (UTC)</div>
      <input type="datetime-local" id="inp-astro-datetime" step="60"
             min="1900-01-01T00:00" max="2100-12-31T23:59"
             style="width:100%; box-sizing:border-box; margin-bottom:5px; border-radius:6px;
                    background:#0d1a26; color:#e0e6ed; border:1px solid #253545; padding:6px;
                    font-family:monospace; font-size:13px; color-scheme:dark;">
      <!-- v7.1.1: времена года -->
      <details id="seasons-details" style="margin-bottom:4px;">
        <summary data-i18n="seasonsTitle" style="cursor:pointer; font-size:0.85rem; color:#a0d8ef;">Времена года</summary>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:5px 0;">
          <button id="btn-season-0" class="btn-preset" style="padding:5px 2px;font-size:10px;">♈ равноденствие · март</button>
          <button id="btn-season-1" class="btn-preset" style="padding:5px 2px;font-size:10px;">☀ солнцестояние · июнь</button>
          <button id="btn-season-2" class="btn-preset" style="padding:5px 2px;font-size:10px;">♎ равноденствие · сент.</button>
          <button id="btn-season-3" class="btn-preset" style="padding:5px 2px;font-size:10px;">❄ солнцестояние · дек.</button>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-season-mk">
          <span class="checkbox-custom"></span>
          <span data-i18n="seasonMkChk">Отметки Солнца в эти моменты</span>
        </label>
      </details>
      <!-- v7.1.0: блок «Затмения» -->
      <details id="ecl-details" open style="margin-bottom:4px;">
        <summary data-i18n="eclTitle" style="cursor:pointer; font-size:0.85rem; color:#a0d8ef;">🌘 Затмения</summary>
        <select id="ecl-list" style="width:100%; box-sizing:border-box; margin:5px 0; border-radius:6px;
                background:#0d1a26; color:#e0e6ed; border:1px solid #253545; padding:5px; font-size:11px;"></select>
        <div style="display:flex; gap:4px; margin-bottom:3px;">
          <button id="btn-ecl-prev-solar" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="eclPrevSolar">◀ Солнечное</button>
          <button id="btn-ecl-next-solar" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="eclNextSolar">Солнечное ▶</button>
        </div>
        <div style="display:flex; gap:4px; margin-bottom:3px;">
          <button id="btn-ecl-prev-lunar" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="eclPrevLunar">◀ Лунное</button>
          <button id="btn-ecl-next-lunar" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="eclNextLunar">Лунное ▶</button>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-ecl-area" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="eclAreaChk">Область видимости (пятно)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-ecl-track">
          <span class="checkbox-custom"></span>
          <span data-i18n="eclTrackChk">След (линия центра)</span>
        </label>
      </details>
      <!-- v7.2.1: блок «Транзиты» -->
      <details id="tr-details" style="margin-bottom:4px;">
        <summary data-i18n="trTitle" style="cursor:pointer; font-size:0.85rem; color:#a0d8ef;">☿♀ Транзиты по диску Солнца</summary>
        <select id="tr-list" style="width:100%; box-sizing:border-box; margin:5px 0; border-radius:6px;
                background:#0d1a26; color:#e0e6ed; border:1px solid #253545; padding:5px; font-size:11px;"></select>
        <div style="display:flex; gap:4px; margin-bottom:3px;">
          <button id="btn-tr-prev-mer" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="trPrevMer">◀ Меркурий</button>
          <button id="btn-tr-next-mer" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="trNextMer">Меркурий ▶</button>
        </div>
        <div style="display:flex; gap:4px; margin-bottom:3px;">
          <button id="btn-tr-prev-ven" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="trPrevVen">◀ Венера</button>
          <button id="btn-tr-next-ven" class="btn-preset" style="flex:1;padding:5px 2px;font-size:10px;" data-i18n="trNextVen">Венера ▶</button>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-tr-area" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="trAreaChk">Карта видимости (начало → конец)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-tr-track" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="trTrackChk">Путь Солнца в зените, C1 / макс. / C4</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-tr-disc" checked>
          <span class="checkbox-custom"></span>
          <span data-i18n="trDiscChk">Диск Солнца с путём планеты</span>
        </label>
      </details>
      <div id="tr-disc" style="display:none;"></div>
      <div id="tr-info" style="font-family:monospace; font-size:10px; color:#f0d8a0;
           text-align:center; white-space:pre-line; min-height:12px; margin-bottom:6px;"></div>
      <div id="ecl-info" style="font-family:monospace; font-size:10px; color:#c8d8f0;
           text-align:center; min-height:12px; margin-bottom:6px;"></div>
      <div id="observer-info" style="font-family:monospace; font-size:10px; color:#8fe3f0;
           text-align:center; white-space:pre-line; margin-bottom:6px;"></div>
      <div id="shadow-info" style="font-family:monospace; font-size:10px; color:#c8b8f0;
           text-align:center; white-space:pre-line; margin-bottom:6px;"></div>

      <!-- Годовой ползунок (шаг 1 сутки) -->
      <div style="display:flex; align-items:center; gap:4px; margin-bottom:3px;">
        <span style="font-size:9px; color:#6a8a9a; min-width:26px; text-align:right;" data-i18n="yearLbl">год</span>
        <input type="range" id="day-slider"
               min="0" max="364" value="0" step="1"
               style="flex:1;">
      </div>

      <!-- Суточный ползунок (шаг 1 минута) -->
      <div style="display:flex; align-items:center; gap:4px; margin-bottom:6px;">
        <span style="font-size:9px; color:#6a8a9a; min-width:26px; text-align:right;">UTC</span>
        <input type="range" id="sun-slider"
               min="0" max="1439" value="720" step="1"
               style="flex:1;">
      </div>

      <!-- Кнопки навигации по дням -->
      <div style="display:flex; gap:5px; margin-bottom:5px;">
        <button id="btn-astro-prev" class="btn-preset" style="flex:1;padding:5px 2px;" data-i18n="prevDay">← День</button>
        <button id="btn-astro-now"  class="btn-preset" style="flex:1;padding:5px 2px;" data-i18n="nowBtn">⊙ Сейчас</button>
        <button id="btn-astro-next" class="btn-preset" style="flex:1;padding:5px 2px;" data-i18n="nextDay">День →</button>
      </div>

      <!-- Суточное движение (v6.5.0): реальная скорость ×1, ×10, ×20, ×100 + ползунок.
           Тексты кнопок ставит updatePlayButtons() -->
      <div data-i18n="secDiurnal"
           style="font-size:10px; color:#7fb2d4; margin:6px 0 3px;">Суточное движение</div>
      <div style="display:flex; gap:4px; margin-bottom:4px;">
        <button id="btn-spd-1"   class="btn-preset" data-i18n-title="speedRealTitle"
                title="Реальная скорость: 1 с = 1 с"
                style="flex:1.7; padding:5px 2px; font-size:10px;">▶ ×1</button>
        <button id="btn-spd-10"  class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;">▶ ×10</button>
        <button id="btn-spd-20"  class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;">▶ ×20</button>
        <button id="btn-spd-100" class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;">▶ ×100</button>
        <button id="btn-spd-3600" class="btn-preset" data-i18n-title="speedDeg" title="15°/с (1 ч за 1 с)"
                style="flex:1.3; padding:5px 2px; font-size:10px;">▶ ×3600</button>
      </div>
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:2px;">
        <button id="btn-speed-play" class="btn-preset" data-i18n-title="speedPlayTitle"
                title="Пуск / пауза" style="padding:4px 9px; font-size:11px;">▶</button>
        <input type="range" id="slider-speed" min="0" max="1000" value="0" step="1"
               data-i18n-title="speedSliderTitle" title="Скорость анимации"
               style="flex:1; accent-color:#3ab4ff;">
      </div>
      <div id="speed-readout"
           style="font-size:9px; color:#5a8a9a; text-align:center; min-height:12px;
                  font-family:monospace; margin-bottom:4px;"></div>

      <!-- Годовое движение и звёздные сутки: шаг на кадр -->
      <div data-i18n="secYearly"
           style="font-size:10px; color:#7fb2d4; margin:6px 0 3px;">Годовое движение · звёздные сутки</div>
      <div style="display:flex; gap:5px; margin-bottom:4px;">
        <button id="btn-play-day"      class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;"
                data-i18n-title="playDayTitle" title="Годовая анимация: шаг 1 сутки">▶ 24ч</button>
        <button id="btn-play-sidereal" class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;"
                data-i18n-title="playSidTitle" title="Звёздные сутки: шаг 23ч 56м 4с">▶ ☆сут</button>
      </div>

      <!-- Созвездия, в которых находятся показанные тела (v6.0.0);
           заполняется из renderZodiac() -->
      <div id="zodiac-info"
           style="display:none; font-family:monospace; font-size:10px;
                  color:#c8d8f0; line-height:1.6; text-align:center;
                  margin:4px 0;"></div>

      <!-- Подсказка активного режима -->
      <div id="astro-mode-hint"
           style="font-size:9px; color:#5a8a9a; text-align:center;
                  margin-top:3px; min-height:12px;"></div>
    </div>

    <!-- Форма добавления точек -->
    <div class="user-points-form">
      <details id="points-details">
      <summary data-i18n="pointsTitle" style="cursor:pointer; font-size:0.85rem; color:#a0d8ef; margin-bottom:6px;">Управление точками</summary>
      <div class="control-group">
        <input type="text" id="add-name"
               data-i18n-placeholder="pointsName"
               placeholder="Название города или объекта"
               style="width:100%; box-sizing:border-box; border-radius:6px;">
      </div>
      <div class="control-group" style="margin-top:6px;">
        <div class="input-row">
          <input type="text" inputmode="decimal" id="add-lat"
                 data-i18n-placeholder="pointsLat" placeholder="Широта">
          <button class="btn-sign" data-target="add-lat" title="±">±</button>
        </div>
      </div>
      <div class="control-group" style="margin-top:6px;">
        <div class="input-row">
          <input type="text" inputmode="decimal" id="add-lon"
                 data-i18n-placeholder="pointsLon" placeholder="Долгота">
          <button class="btn-sign" data-target="add-lon" title="±">±</button>
        </div>
      </div>
      <button id="btn-add-point" class="btn-primary btn-add-point"
              data-i18n="addBtn" style="margin-top:10px;">+ Добавить на карту</button>
      <div id="points-manager" class="points-manager">
        <p class="presets-title" data-i18n="activePoints"
           style="margin-top:12px;">Список активных точек</p>
        <ul id="points-list" class="points-list"></ul>
      </div>
      </details>
    </div>

    <div id="status" class="status-bar">…</div>
  </div>

  <!-- Карта -->
  <div id="map">
    <div id="top-info"></div>
    <button id="btn-ruler-map" class="map-overlay-btn" title="📏">📏</button>
  </div>

  <!--
    Плавающий тултип маршрута.
    Показывается при hover/click на линию рейса.
    Позиционируется в JS через style.left/top.
    pointer-events:none — чтобы не мешал зуму и линейке.
  -->
  <div id="route-tooltip" style="
    display: none;
    position: fixed;
    z-index: 1000;
    background: rgba(0,8,28,0.93);
    border: 1px solid #3a8abf;
    border-radius: 6px;
    padding: 8px 12px;
    pointer-events: none;
    font-size: 11px;
    color: #e0f0ff;
    font-family: monospace;
    min-width: 170px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.6);
    line-height: 1.5;
  "></div>

  <!--
    Плавающий тултип МКС (v5.8.0).
    Показывается при hover/click на маркер МКС в слое layer-iss.
    pointer-events:none — не блокирует взаимодействие с картой.
  -->
  <div id="iss-tooltip" style="
    display: none;
    position: fixed;
    z-index: 1001;
    background: rgba(0,8,28,0.93);
    border: 1px solid #00ff88;
    border-radius: 6px;
    padding: 8px 12px;
    pointer-events: none;
    font-size: 11px;
    color: #e0f0ff;
    font-family: monospace;
    min-width: 130px;
    box-shadow: 0 2px 12px rgba(0,255,136,0.25);
    line-height: 1.5;
  "></div>

</body>
</html>
