<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта Земли</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        .info { margin: 10px 0; font-size: 1.1em; }
        img { margin-top: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Карта Земли</h1>

    <div class="info">
        <p>Центр проекции: Северный полюс (lat={{ center_lat }}°, lon={{ center_lon }}°)</p>
        <p>Время местное: {{ local_time }}</p>
        <p>UTC: {{ utc_time }}</p>
    </div>

    <img src="{{ url_for('static', filename='map.png') }}" alt="Карта Земли" width="600">
</body>
</html>
