<!DOCTYPE html>
<!--
  Файл    : frontend/index.html
  Версия  : 1.9.0 (HTML_V=10)
  Изменения 5.8.0: cache-bust ?v=580 — МКС трекинг, satellite.js 4.1.3,
                   chk-iss, btn-play-iss, iss-speed-btns, slider-iss-speed,
                   iss-tooltip
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlatEarthMap</title>

  <!-- 1. Стили — первыми чтобы не было мигания -->
  <link rel="stylesheet" href="/static/style.css?v=580">

  <!-- 2. D3.js v7 — до всех map-скриптов, они зависят от d3.* -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <!-- 3. Astronomy-engine — до astro.js, astroOk() проверяет его наличие -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.js"></script>

  <!-- 4. satellite.js 4.1.3 — SGP4-пропагатор для МКС (v5.8.0)
       Должен быть загружен до astro.js (satelliteOk() и loadIssTle()) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>

  <!-- 5. Модули карты — строго в этом порядке:
       config → state → astro → render → main
       Каждый следующий видит глобальные переменные предыдущего -->
  <script src="/static/config.js?v=580"></script>
  <script src="/static/state.js?v=580"></script>
  <script src="/static/astro.js?v=580"></script>
  <script src="/static/render.js?v=580"></script>
  <script src="/static/main.js?v=580"></script>

</head>
<body>
  <div id="controls">
    <h2 class="panel-title">
      <span>AE Map <span class="version-badge">…</span></span>
      <span class="lang-switcher">
        <button class="btn-lang" data-lang="ru">RU</button>
        <button class="btn-lang" data-lang="en">EN</button>
        <button class="btn-lang" data-lang="de">DE</button>
      </span>
    </h2>

    <div class="control-group">
      <label for="inp-lat" data-i18n="latLabel">Широта центра</label>
      <div class="input-row">
        <input type="text" inputmode="decimal" id="inp-lat"
               value="90" placeholder="−90…90" autocomplete="off">
        <button class="btn-sign" data-target="inp-lat" title="±">±</button>
      </div>
    </div>

    <div class="control-group">
      <label for="inp-lon" data-i18n="lonLabel">Долгота центра</label>
      <div class="input-row">
        <input type="text" inputmode="decimal" id="inp-lon"
               value="0" placeholder="−180…180" autocomplete="off">
        <button class="btn-sign" data-target="inp-lon" title="±">±</button>
      </div>
    </div>

    <button id="btn-apply" class="btn-primary" data-i18n="applyBtn">▶ Применить центр</button>

    <div class="presets">
      <button class="btn-preset" data-lat="90"  data-lon="0"  data-i18n="presetN">Сев. полюс</button>
      <button class="btn-preset" data-lat="-90" data-lon="0"  data-i18n="presetS">Юж. полюс</button>
      <button class="btn-preset" data-lat="0"   data-lon="0"  data-i18n="presetEq">Экватор / 0,0</button>
      <button id="btn-reset-zoom" class="btn-preset"
              style="background:#2a4a6a;" data-i18n="resetZoom">⊙ Сброс зума</button>
    </div>

    <!-- Чекбоксы карты -->
    <div class="control-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-grid" checked>
        <span class="checkbox-custom"></span>
        <span data-i18n="gridChk">Сетка 30°</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-labels">
        <span class="checkbox-custom"></span>
        <span data-i18n="labelsChk">Подписи координат</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-cities" checked>
        <span class="checkbox-custom"></span>
        <span data-i18n="citiesChk">🏙 Города и метки</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-ruler">
        <span class="checkbox-custom"></span>
        <span data-i18n="rulerChk">📏 Линейка расстояний</span>
      </label>
      <!-- Маршруты рейсов — дуги великого круга -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-routes">
        <span class="checkbox-custom"></span>
        <span data-i18n="routesChk">✈ Маршруты рейсов</span>
      </label>
    </div>

    <!-- Чекбоксы астрономии -->
    <div class="control-group checkbox-group"
         style="border-top:1px solid #1e3a5a; padding-top:6px; margin-top:4px;">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-sun">
        <span class="checkbox-custom"></span>
        <span>☀ Солнце</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-night">
        <span class="checkbox-custom"></span>
        <span>🌓 День / Ночь</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-moon">
        <span class="checkbox-custom"></span>
        <span>🌙 Луна</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-planets">
        <span class="checkbox-custom"></span>
        <span>🪐 Планеты</span>
      </label>
      <!-- МКС (v5.8.0) — после Планет, перед Звёздами -->
      <label class="checkbox-label">
        <input type="checkbox" id="chk-iss">
        <span class="checkbox-custom"></span>
        <span>🛰 МКС</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-stars">
        <span class="checkbox-custom"></span>
        <span>✦ Звёзды</span>
      </label>
    </div>

    <!-- Панель времени — скрыта если ни один астро-чекбокс не включён -->
    <div id="astro-time" style="display:none; padding:4px 0;">
      <div id="astro-display"
           style="font-family:monospace; font-size:11px; color:#a0c4d8;
                  text-align:center; margin-bottom:5px;">…</div>

      <!-- Годовой ползунок (шаг 1 сутки) -->
      <div style="display:flex; align-items:center; gap:4px; margin-bottom:3px;">
        <span style="font-size:9px; color:#6a8a9a; min-width:26px; text-align:right;">год</span>
        <input type="range" id="day-slider"
               min="0" max="364" value="0" step="1"
               style="flex:1;">
      </div>

      <!-- Суточный ползунок (шаг 1 минута) -->
      <div style="display:flex; align-items:center; gap:4px; margin-bottom:6px;">
        <span style="font-size:9px; color:#6a8a9a; min-width:26px; text-align:right;">UTC</span>
        <input type="range" id="sun-slider"
               min="0" max="1439" value="720" step="1"
               style="flex:1;">
      </div>

      <!-- Кнопки навигации по дням -->
      <div style="display:flex; gap:5px; margin-bottom:5px;">
        <button id="btn-astro-prev" class="btn-preset" style="flex:1;padding:5px 2px;">← День</button>
        <button id="btn-astro-now"  class="btn-preset" style="flex:1;padding:5px 2px;">⊙ Сейчас</button>
        <button id="btn-astro-next" class="btn-preset" style="flex:1;padding:5px 2px;">День →</button>
      </div>

      <!-- Четыре кнопки анимации — v5.8.0: добавлена ▶ МКС -->
      <div style="display:flex; gap:5px; margin-bottom:4px;">
        <button id="btn-play-hour"     class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;"
                title="Суточная анимация: шаг 1 час">▶ 1ч</button>
        <button id="btn-play-day"      class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;"
                title="Годовая анимация: шаг 1 сутки">▶ 24ч</button>
        <button id="btn-play-sidereal" class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px;"
                title="Звёздные сутки: шаг 23ч 56м 4с">▶ ☆сут</button>
        <button id="btn-play-iss"      class="btn-preset"
                style="flex:1; padding:5px 2px; font-size:10px; color:#00ff88;"
                title="МКС: шаг 1 мин × скорость">▶ МКС</button>
      </div>

      <!-- Блок скорости МКС — виден только при mode=iss (v5.8.0)
           display:none при инициализации; управляется из updatePlayButtons() -->
      <div id="iss-speed-btns"
           style="display:none; flex-wrap:wrap; gap:4px; margin-bottom:4px;">
        <!-- Кнопки ×N: id=btn-iss-speed-{N}, N из ISS_SPEED_OPTIONS -->
        <button id="btn-iss-speed-1"   class="btn-preset"
                style="flex:1; padding:4px 2px; font-size:10px; min-width:34px;">×1</button>
        <button id="btn-iss-speed-10"  class="btn-preset"
                style="flex:1; padding:4px 2px; font-size:10px; min-width:34px;">×10</button>
        <button id="btn-iss-speed-20"  class="btn-preset"
                style="flex:1; padding:4px 2px; font-size:10px; min-width:34px;">×20</button>
        <button id="btn-iss-speed-100" class="btn-preset"
                style="flex:1; padding:4px 2px; font-size:10px; min-width:34px;">×100</button>
        <!-- Непрерывный слайдер скорости 1..100; синхронизирован с кнопками -->
        <div style="width:100%; display:flex; align-items:center; gap:4px;">
          <span style="font-size:9px; color:#00ff88; min-width:28px;">×скор</span>
          <input type="range" id="slider-iss-speed"
                 min="1" max="100" value="1" step="1"
                 style="flex:1; accent-color:#00ff88;">
        </div>
      </div>

      <!-- Подсказка активного режима -->
      <div id="astro-mode-hint"
           style="font-size:9px; color:#5a8a9a; text-align:center;
                  margin-top:3px; min-height:12px;"></div>
    </div>

    <!-- Форма добавления точек -->
    <div class="user-points-form">
      <h3 data-i18n="pointsTitle">Управление точками</h3>
      <div class="control-group">
        <input type="text" id="add-name"
               data-i18n-placeholder="pointsName"
               placeholder="Название города или объекта"
               style="width:100%; box-sizing:border-box; border-radius:6px;">
      </div>
      <div class="control-group" style="margin-top:6px;">
        <div class="input-row">
          <input type="text" inputmode="decimal" id="add-lat"
                 data-i18n-placeholder="pointsLat" placeholder="Широта">
          <button class="btn-sign" data-target="add-lat" title="±">±</button>
        </div>
      </div>
      <div class="control-group" style="margin-top:6px;">
        <div class="input-row">
          <input type="text" inputmode="decimal" id="add-lon"
                 data-i18n-placeholder="pointsLon" placeholder="Долгота">
          <button class="btn-sign" data-target="add-lon" title="±">±</button>
        </div>
      </div>
      <button id="btn-add-point" class="btn-primary btn-add-point"
              data-i18n="addBtn" style="margin-top:10px;">+ Добавить на карту</button>
      <div id="points-manager" class="points-manager">
        <p class="presets-title" data-i18n="activePoints"
           style="margin-top:12px;">Список активных точек</p>
        <ul id="points-list" class="points-list"></ul>
      </div>
    </div>

    <div id="status" class="status-bar">…</div>
  </div>

  <!-- Карта -->
  <div id="map">
    <button id="btn-ruler-map" class="map-overlay-btn" title="📏">📏</button>
  </div>

  <!--
    Плавающий тултип маршрута.
    Показывается при hover/click на линию рейса.
    Позиционируется в JS через style.left/top.
    pointer-events:none — чтобы не мешал зуму и линейке.
  -->
  <div id="route-tooltip" style="
    display: none;
    position: fixed;
    z-index: 1000;
    background: rgba(0,8,28,0.93);
    border: 1px solid #3a8abf;
    border-radius: 6px;
    padding: 8px 12px;
    pointer-events: none;
    font-size: 11px;
    color: #e0f0ff;
    font-family: monospace;
    min-width: 170px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.6);
    line-height: 1.5;
  "></div>

  <!--
    Плавающий тултип МКС (v5.8.0).
    Показывается при hover/click на маркер МКС в слое layer-iss.
    pointer-events:none — не блокирует взаимодействие с картой.
  -->
  <div id="iss-tooltip" style="
    display: none;
    position: fixed;
    z-index: 1001;
    background: rgba(0,8,28,0.93);
    border: 1px solid #00ff88;
    border-radius: 6px;
    padding: 8px 12px;
    pointer-events: none;
    font-size: 11px;
    color: #e0f0ff;
    font-family: monospace;
    min-width: 130px;
    box-shadow: 0 2px 12px rgba(0,255,136,0.25);
    line-height: 1.5;
  "></div>

</body>
</html>
